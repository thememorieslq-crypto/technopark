<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Технопарк</title>
    <link rel="stylesheet" href="/css/style.css" />

    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three/build/three.module.js"
            }
        }
    </script>

    <script type="module" src="./libs/model-viewer.min.js"></script>
    <script type="module" src="/js/app.js"></script>

    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/assets/icons/android-chrome-256x256.png">
    <link rel="icon" type="image/png" sizes="384x384" href="/assets/icons/android-chrome-384x384.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="1024x1024" href="/assets/icons/android-chrome-1024x1024.png">

    <!-- Apple iOS -->
    <link rel="apple-touch-icon" sizes="57x57" href="/assets/icons/apple-touch-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/assets/icons/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/assets/icons/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/assets/icons/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/assets/icons/apple-touch-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/icons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/assets/icons/apple-touch-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/icons/apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="120x120" href="/assets/icons/favicon-120x120.png">
    <link rel="icon" type="image/png" sizes="180x180" href="/assets/icons/favicon-180x180.png">
    <link rel="shortcut icon" href="/assets/icons/favicon.ico">

    <!-- Maskable -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/maskable-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/maskable-icon-512x512.png">
    <link rel="icon" type="image/png" sizes="1024x1024" href="/assets/icons/maskable-icon-1024x1024.png">

    <!-- Windows Metro -->
    <meta name="msapplication-square70x70logo" content="/assets/icons/mstile-70x70.png">
    <meta name="msapplication-square150x150logo" content="/assets/icons/mstile-150x150.png">
    <meta name="msapplication-square310x310logo" content="/assets/icons/mstile-310x310.png">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Технопарк">
</head>
<body>

    <div id="room-menu">
        <button id="burger-btn">☰</button>
        <button id="search-btn" style="margin-left: 10px; background: rgba(20,20,20,0.9); color: white; border: 1px solid #555; border-radius: 4px; padding: 10px 16px; font-size: 18px; cursor: pointer;">🔍</button>
        <div id="room-list"></div>
    </div>

    <div id="search-modal" class="search-modal" style="display: none;">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h3>Поиск</h3>
                <button id="close-search-btn" class="close-search-btn">&times;</button>
            </div>
            <div class="search-tabs">
                <button id="tab-equipment" class="search-tab active">Оборудование</button>
                <button id="tab-rooms" class="search-tab">Аудитории</button>
            </div>
            <div class="search-modal-body">
                <input type="text" id="search-input" placeholder="Поиск..." autocomplete="off">
                <div id="search-results" class="search-results"></div>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <div id="panorama-loader" class="loader hidden">
        <div class="spinner"></div>
        <span>Загрузка панорамы...</span>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal" onclick="event.stopPropagation()">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="modal-3d">
                <model-viewer 
                    id="model-viewer"
                    camera-controls
                    auto-rotate
                    ar-status="not-presenting"
                    loading="eager"
                    shadow-intensity="1"
                    environment-image="neutral"
                ></model-viewer>
            </div>
            <div class="modal-info">
                <h2 id="modal-title">Название</h2>
                <p id="modal-text">Описание...</p>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
